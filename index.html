<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181a16">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23f3c878'/%3E%3Cpath d='m7 15 9-5 9 5-9 5zm0 4 9 5 9-5m-9-9v10' fill='none' stroke='%2323241c' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>筑城之间 · 施工沙盘</title>
  <meta name="description" content="沿时间轴观察从地基到封顶的微缩施工街区。">
</head>
<body>
  <svg aria-hidden="true" class="icon-library" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-brand" viewBox="0 0 24 24"><path d="m2.5 11 9.5-5.5 9.5 5.5-9.5 5.5L2.5 11ZM2.5 15l9.5 5.5 9.5-5.5M12 5.5v11"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M9 5v14m6-14v14"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M3.5 9h4L12 5v14l-4.5-4h-4zM15.5 9a4.3 4.3 0 0 1 0 6m2.5-8a7 7 0 0 1 0 10"/></symbol>
    <symbol id="icon-mute" viewBox="0 0 24 24"><path d="M3.5 9h4L12 5v14l-4.5-4h-4zM16 10l5 5m0-5-5 5"/></symbol>
    <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="icon-shrink" viewBox="0 0 24 24"><path d="M4 9h5V4m6 0v5h5m0 6h-5v5m-6 0v-5H4"/></symbol>
    <symbol id="icon-movie" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 6v12M17 6v12M3 10h4m-4 4h4m10-4h4m-4 4h4"/></symbol>
    <symbol id="icon-debug" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 15A8.8 8.8 0 0 1 9 3.5 8.8 8.8 0 1 0 20.5 15Z"/></symbol>
    <symbol id="icon-rain" viewBox="0 0 24 24"><path d="M6 15a3.8 3.8 0 0 1-.5-7.5A5.7 5.7 0 0 1 16.4 7a4 4 0 1 1 1.1 7.8M8 17l-1 3m5-3-1 3m5-3-1 3"/></symbol>
    <symbol id="icon-snow" viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9m-15.6 0 15.6-9M9.5 5.5 12 8l2.5-2.5m-5 13 2.5-2.5 2.5 2.5M4 10l3.5-.9-.9-3.4m13.4 8.3-3.5.9.9 3.4M6.6 18.3l.9-3.4L4 14m13.4-8.3-.9 3.4L20 10"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2.3 6M4 5v6h6"/></symbol>
    <symbol id="icon-overview" viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5zm0 0v6l9 5 9-5V9m-9 5v6"/></symbol>
    <symbol id="icon-loading" viewBox="0 0 24 24"><path d="M3 6h11v10H3zm11 4h4l3 3v3h-7M8 18h8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="icon-crane" viewBox="0 0 24 24"><path d="M3 20h12m-8 0V5l5-2 9 4H3m4 2 5 3-5 3 5 3m0 2V3m5 4v6a2 2 0 1 0 2 2"/></symbol>
    <symbol id="icon-orbit" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-35 12 12)"/><circle cx="12" cy="12" r="2.3"/><path d="m18.5 5 1 3.5-3.5-.1"/></symbol>
    <symbol id="icon-tour" viewBox="0 0 24 24"><path d="M7 6h10a3 3 0 1 1 0 6H7a3 3 0 1 0 0 6h10m-3-3 3 3-3 3"/><circle cx="5" cy="6" r="2"/></symbol>
    <symbol id="icon-follow" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 3v3m0 12v3m-9-9h3m12 0h3m-9-1v2m-1-1h2"/></symbol>
    <symbol id="icon-pointer" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v4"/></symbol>
  </svg>

  <main aria-label="三维施工街区" class="stage-wrap">
    <canvas id="stage" aria-label="可交互的三维施工街区"></canvas>
    <noscript>打开 JavaScript 后即可浏览施工沙盘。</noscript>
  </main>

  <div id="hud" class="hud">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon"><svg aria-hidden="true"><use href="#icon-brand"/></svg></span>
        <h1>筑城之间</h1>
        <span class="brand-context">施工沙盘</span>
      </div>
      <div class="top-actions">
        <button id="debug" class="icon-button" type="button" aria-label="性能诊断" aria-pressed="false" title="性能诊断（F2）"><svg aria-hidden="true"><use href="#icon-debug"/></svg></button>
        <button id="audio" class="icon-button" type="button" aria-label="环境声" aria-pressed="false" title="开启环境声"><svg aria-hidden="true"><use href="#icon-mute"/></svg></button>
        <button id="fullscreen" class="icon-button" type="button" aria-label="全屏" aria-pressed="false" title="全屏"><svg aria-hidden="true"><use href="#icon-fullscreen"/></svg></button>
        <button id="immersive" class="immersion-button" type="button" title="沉浸播放（Esc 返回）"><svg aria-hidden="true"><use href="#icon-movie"/></svg><span>沉浸</span></button>
      </div>
    </header>

    <div class="side-stack">
      <aside class="panel status-panel" aria-label="施工状态">
        <div class="panel-heading"><h2 id="phase">第三层施工</h2><span id="run-status" class="run-status"><span></span><span>运行</span></span></div>
        <div class="stats">
          <div><span>已完楼层</span><strong id="floors">2<small> / 12</small></strong></div>
          <div><span>在场工人</span><strong id="workers">12<small> 人</small></strong></div>
        </div>
        <div class="progress-track" id="construction-progress" role="progressbar" aria-label="主体结构完成进度" aria-valuemin="0" aria-valuemax="12" aria-valuenow="2"><i></i></div>
        <div class="status-row"><span>当前作业</span><strong id="operation">车辆进场</strong></div>
        <div class="status-row inventory-row"><span>已吊装批次</span><strong id="inventory">0</strong></div>
        <div id="selection" class="selection" hidden>
          <div class="selection-heading"><span>选中对象</span><span id="entity-type"></span></div>
          <strong id="entity-name"></strong>
          <div id="entity-status" class="entity-status"></div>
          <div id="entity-detail" class="entity-detail"></div>
        </div>
      </aside>

      <section class="panel environment-panel" aria-label="场景环境">
        <h2>场景环境</h2>
        <div class="environment-row">
          <span>时间</span>
          <div class="segments" role="group" aria-label="昼夜切换">
            <button type="button" data-daylight="day" aria-pressed="true" title="白天" aria-label="白天"><svg aria-hidden="true"><use href="#icon-sun"/></svg><span>白天</span></button>
            <button type="button" data-daylight="night" aria-pressed="false" title="夜晚" aria-label="夜晚"><svg aria-hidden="true"><use href="#icon-moon"/></svg><span>夜晚</span></button>
          </div>
        </div>
        <div class="environment-row">
          <span>天气</span>
          <div class="segments" role="group" aria-label="天气">
            <button type="button" data-weather="clear" aria-pressed="true" title="晴天" aria-label="晴天"><svg aria-hidden="true"><use href="#icon-sun"/></svg><span>晴</span></button>
            <button type="button" data-weather="rain" aria-pressed="false" title="下雨" aria-label="下雨"><svg aria-hidden="true"><use href="#icon-rain"/></svg><span>雨</span></button>
            <button type="button" data-weather="snow" aria-pressed="false" title="下雪" aria-label="下雪"><svg aria-hidden="true"><use href="#icon-snow"/></svg><span>雪</span></button>
          </div>
        </div>
        <div class="environment-row">
          <span>灯光</span>
          <div class="segments" role="group" aria-label="灯光">
            <button type="button" data-light="auto" aria-pressed="true">自动</button>
            <button type="button" data-light="on" aria-pressed="false">开启</button>
            <button type="button" data-light="off" aria-pressed="false">关闭</button>
          </div>
        </div>
      </section>
    </div>

    <section class="camera-dock" aria-label="镜头预设">
      <div class="camera-heading">
        <h2>镜头</h2>
        <button id="camera-reset" class="text-button" type="button" title="恢复默认机位"><svg aria-hidden="true"><use href="#icon-reset"/></svg>复位</button>
      </div>
      <div id="camera-list" class="camera-list"></div>
      <p class="gesture-hint"><svg aria-hidden="true"><use href="#icon-pointer"/></svg>拖动旋转 <i></i> 滚轮缩放 <i></i> 右键平移</p>
    </section>

    <section class="timeline panel" aria-label="施工时间轴">
      <div class="playback">
        <button id="playback" type="button" class="playback-button" aria-label="暂停" title="暂停"><svg aria-hidden="true"><use href="#icon-pause"/></svg></button>
        <div class="clock"><span id="date-label">DAY 05</span><time id="time-label">10:30</time></div>
        <label class="speed-control">
          <span class="visually-hidden">播放速度</span>
          <select id="speed">
            <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option><option value="20">20×</option>
          </select>
        </label>
      </div>
      <div class="timeline-track">
        <input id="timeline" type="range" min="0" max="23039" step="1" value="6390" aria-label="施工时间轴">
        <div id="milestones" class="milestones"></div>
      </div>
    </section>

    <div id="metrics" class="panel metrics" hidden aria-label="性能指标"></div>
  </div>

  <button id="restore-ui" class="icon-button restore-ui" type="button" aria-label="退出沉浸" title="退出沉浸（Esc）" hidden><svg aria-hidden="true"><use href="#icon-shrink"/></svg></button>
  <div id="scene-error" class="panel scene-error" role="alert" hidden><strong>无法显示三维沙盘</strong><p></p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
